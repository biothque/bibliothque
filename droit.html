<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Commande d’Ouvrage</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body::before {
      content: "";
      background-image: url('background.jpg'); /* remplace par le chemin de ton image */
      background-size: cover;
      background-position: center;
      filter: blur(8px);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      max-width: 500px;
      margin: 80px auto;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Commander un Ouvrage</h2>
    <form id="commandeForm">
      <label for="nom">Nom :</label>
      <input type="text" id="nom" name="nom" required>
      <label for="ouvrage">Titre de l’ouvrage :</label>
      <input type="text" id="ouvrage" name="ouvrage" required>

      <label for="quantite">Quantité :</label>
      <input type="number" id="quantite" name="quantite" min="1" required>
      <button type="submit">Envoyer la commande</button>
    </form>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function() {
      emailjs.init("YOUR_USER_ID"); // <-- Remplace par ton ID EmailJS
    })();

    document.getElementById("commandeForm").addEventListener("submit", function(e) {
      e.preventDefault();

      emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
        nom: document.getElementById("nom").value,
        email: document.getElementById("email").value,
        ouvrage: document.getElementById("ouvrage").value,
        quantite: document.getElementById("quantite").value,
        adresse: document.getElementById("adresse").value
      }).then(function(response) {
        alert("Commande envoyée avec succès !");
        document.getElementById("commandeForm").reset();
      }, function(error) {
        alert("Erreur lors de l’envoi : " + error.text);
      });
    });
  </script>
</body>
</html>
