<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture Sacrée – Thoth</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      position: relative;
      background-color: #000;
    }

    /* Vidéo de fond réduite */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 80%; /* Réduction ici */
      height: auto;
      z-index: -1;
      opacity: 0.8; /* Optionnel : légère transparence */
    }

    .overlay {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
      padding-top: 20vh;
    }

    .btn-connexion {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.8);
      color: #000;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .btn-connexion:hover {
      background: #fff;
    }
  </style>
</head>
<body>
  <!-- Vidéo de fond -->
  <video autoplay muted loop id="bgVideo">
    <source src="thoth-loop.mp4" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo HTML5.
  </video>

  <!-- Contenu visible -->
  <div class="overlay">
    <h1>Bienvenue</h1>
    <p>Écrire et lire, voyageons à travers la ligne temporelle</p>
    <a href="login.html" class="btn-connexion" onclick="vibrateButton()">Connexion</a>
  </div>

  <!-- Script pour vibration -->
  <script>
    function vibrateButton() {
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }
    }
  </script>
</body>
</html>
